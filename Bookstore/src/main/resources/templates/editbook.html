<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>Edit Book</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
	</head>
	<body>
		<div class="container">
			<h1>Edit Book</h1>
			<form action="#" th:action="@{/save}" th:object="${book}" method="post">
				<!-- Piilotettu id, jotta tallennus paivittaa olemassa olevan kirjan -->
				<input type="hidden" th:field="*{id}" />
				<div class="mb-3">
					<label for="title">Title</label>
					<input type="text" class="form-control" id="title" th:field="*{title}" />
				</div>
				<div class="mb-3">
					<label for="author">Author</label>
					<input type="text" class="form-control" id="author" th:field="*{author}" />
				</div>
				<div class="mb-3">
					<label for="publicationYear">Year</label>
					<input type="number" class="form-control" id="publicationYear" th:field="*{publicationYear}" />
				</div>
				<div class="mb-3">
					<label for="isbn">ISBN</label>
					<input type="text" class="form-control" id="isbn" th:field="*{isbn}" />
				</div>
				<div class="mb-3">
					<label for="price">Price</label>
					<input type="number" step="0.01" class="form-control" id="price" th:field="*{price}" />
				</div>
				<div class="mb-3">
					<label for="category">Category</label>
					<select class="form-select" id="category" name="category">
						<option th:each="category : ${categories}"
								th:value="${category.categoryid}"
								th:selected="${book.category != null and category.categoryid == book.category.categoryid}"
								th:text="${category.name}">Category</option>
					</select>
				</div>
				<input type="submit" class="btn btn-success" value="Save" />
				<a class="btn btn-secondary" href="/booklist" th:href="@{/booklist}">Cancel</a>
			</form>
		</div>
	</body>
</html>
