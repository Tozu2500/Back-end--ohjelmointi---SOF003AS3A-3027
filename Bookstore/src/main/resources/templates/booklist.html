<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
		xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	<head>
		<title>Bookstore</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
	</head>
	<body>
		<div class="container">
			<!-- Kirjautunut kayttaja ja uloskirjautuminen (POST /logout) -->
			<div class="d-flex justify-content-between align-items-center mt-3">
				<span>Signed in as <strong sec:authentication="name">username</strong></span>
				<form th:action="@{/logout}" method="post">
					<input type="submit" class="btn btn-outline-secondary" value="Sign Out" />
				</form>
			</div>
			<h1>Books</h1>
			<table class="table table-striped">
				<tr>
					<th>Title</th>
					<th>Author</th>
					<th>Year</th>
					<th>ISBN</th>
					<th>Price</th>
					<th>Category</th>
					<th sec:authorize="hasRole('ADMIN')"></th>
					<th></th>
				</tr>
				<tr th:each="book : ${books}">
					<td th:text="${book.title}">Title</td>
					<td th:text="${book.author}">Author</td>
					<td th:text="${book.publicationYear}">2000</td>
					<td th:text="${book.isbn}">ISBN</td>
					<td th:text="${book.price}">0.0</td>
					<td th:text="${book.category != null} ? ${book.category.name} : ''">Category</td>
					<!-- Poistonappi naytetaan vain ADMIN-roolille -->
					<td sec:authorize="hasRole('ADMIN')"><a class="btn btn-danger" th:href="@{/delete/{id}(id=${book.id})}">Delete</a></td>
					<td><a class="btn btn-primary" th:href="@{/edit/{id}(id=${book.id})}">Edit</a></td>
				</tr>
			</table>
			<a class="btn btn-success" href="/add" th:href="@{/add}">Add Book</a>
		</div>
	</body>
</html>
