<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>Customers</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
	</head>
	<body>
		<div class="container">
			<h1>Customers</h1>
			<table class="table table-striped">
				<tr>
					<th>Name</th>
					<th>Email</th>
					<th></th>
					<th></th>
				</tr>
				<tr th:each="customer : ${customers}">
					<td th:text="${customer.name}">Name</td>
					<td th:text="${customer.email}">Email</td>
					<td><a class="btn btn-danger" th:href="@{/delete/{id}(id=${customer.id})}">Delete</a></td>
					<td><a class="btn btn-primary" th:href="@{/edit/{id}(id=${customer.id})}">Edit</a></td>
				</tr>
			</table>
			<a class="btn btn-success" href="/add" th:href="@{/add}">Add Customer</a>
		</div>
	</body>
</html>
