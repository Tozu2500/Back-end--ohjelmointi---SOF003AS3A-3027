<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>Add Customer</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
	</head>
	<body>
		<div class="container">
			<h1>Add Customer</h1>
			<form action="#" th:action="@{/save}" th:object="${customer}" method="post">
				<div class="mb-3">
					<label for="name">Name</label>
					<input type="text" class="form-control" id="name" th:field="*{name}"
						th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" />
					<div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</div>
				</div>
				<div class="mb-3">
					<label for="email">Email</label>
					<input type="text" class="form-control" id="email" th:field="*{email}"
						th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" />
					<div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</div>
				</div>
				<input type="submit" class="btn btn-success" value="Save" />
				<a class="btn btn-secondary" href="/customerlist" th:href="@{/customerlist}">Cancel</a>
			</form>
		</div>
	</body>
</html>
