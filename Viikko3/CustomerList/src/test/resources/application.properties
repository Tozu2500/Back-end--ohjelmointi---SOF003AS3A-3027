spring.application.name=customerlist

# Testit ajetaan H2-muistikannalla, jotta buildi ei vaadi kaynnissa olevaa MySQL:aa
spring.datasource.url=jdbc:h2:mem:customertestdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
